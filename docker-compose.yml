services:
  api:
    image: tensetiger-api
    build:
      context: ./api
      dockerfile: Dockerfile.local
      args:
        SRV_PORT: ${SRV_PORT}
    ports:
      - 5000:5000
    volumes:
      - ./api:/srv
    depends_on:
      - postgres

  app:
    image: tensetiger-app
    build:
      context: ./app
      dockerfile: Dockerfile.local
    ports:
      - 5173:5173
    volumes:
      - ./app:/app
    depends_on:
      - api

  postgres:
    image: postgres:16
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: "root"
      POSTGRES_USER: tensetiger_dev
      POSTGRES_DB: tensetiger_dev
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./db/initdb.d:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 8080
    ports:
      - 8080:8080
    volumes:
      - ./db/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
