services:
  api:
    image: tensetiger-api
    build:
      context: ./api
      dockerfile: Dockerfile.local
      args:
        SRV_PORT: ${SRV_PORT}
    ports:
      - 5000:5000
    depends_on:
      - postgres
    develop:
      watch:
        - action: sync
          path: ./api
          target: /srv
        - action: rebuild
          path: ./api/requirements.txt

  app:
    image: tensetiger-app
    build:
      context: ./app
      dockerfile: Dockerfile.local
    ports:
      - 5173:5173
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app
          ignore:
            - ./app/node_modules/
        - action: rebuild
          path: ./app/package.json

  postgres:
    image: tensetiger-db
    build:
      context: ./db
      dockerfile: Dockerfile.local
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: "root"
      POSTGRES_USER: tensetiger_dev
      POSTGRES_DB: tensetiger_dev
    develop:
      watch:
        - action: sync+restart
          path: ./db/initdb.d
          target: /docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 8080
    ports:
      - 8080:8080
    volumes:
      - ./db/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
